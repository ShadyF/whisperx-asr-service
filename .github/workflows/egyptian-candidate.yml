name: Egyptian candidate image

on:
  push:
    branches: [feature/egyptian-turbo]

permissions:
  contents: read
  packages: write

# Serialize all candidate writes, including reruns, without cancelling a publisher.
concurrency:
  group: egyptian-candidate-publication
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/egyptian-turbo'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Resolve immutable candidate identity
        id: existing
        run: |
          # Fail closed on registry errors before considering a build.
          python3 scripts/candidate_publish.py resolve

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.digest == ''

      - uses: docker/login-action@v4
        if: steps.existing.outputs.digest == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standard image by digest only
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/shadyf/whisperx-asr-service,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TORCH_VERSION=2.7.1
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ShadyF/whisperx-asr-service

      - name: Publish verified candidate tags
        env:
          CANDIDATE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          # Preserve the commit identity and promote only a current branch head.
          python3 scripts/candidate_publish.py publish
